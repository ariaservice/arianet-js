name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v0.1.0
        required: true

permissions:
  contents: write
  id-token: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json
        run: test "$(node -p 'require("./package.json").version')" = "${TAG#v}" || { echo "package.json version is not ${TAG#v}"; exit 1; }
      - run: npm ci
      - run: npm test
      - run: npm pack
      - name: GitHub release with the package tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" arianet-*.tgz --clobber
          else
            gh release create "$TAG" arianet-*.tgz --verify-tag --title "$TAG" --generate-notes
          fi
      # Publishes only when the NPM_TOKEN secret (an npm automation token of the
      # account that owns the "arianet" package) is set.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not set; skipping npm publish."
            exit 0
          fi
          npm publish --provenance --access public
